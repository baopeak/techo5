name: Test Xiaozhi search MCP

on:
  push:
    branches: [main]
    paths: ['xiaozhi-search/**', '.github/workflows/xiaozhi-search.yml']
  pull_request:
    paths: ['xiaozhi-search/**', '.github/workflows/xiaozhi-search.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiaozhi-search
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: xiaozhi-search/go.sum
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
          sh -n xiaozhi-search-run
      - name: Build crown static ARMv7 binary
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X main.buildID=${GITHUB_SHA}" -o ../bin/xiaozhi-search-mcp-arm .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xiaozhi-search-mcp-arm
          path: bin/xiaozhi-search-mcp-arm
          if-no-files-found: error
