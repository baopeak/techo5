Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "AllowMouseOpenFail" "true"
    Option "DontVTSwitch" "true"
EndSection
Section "Device"
    Identifier "EchoFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "Rotate" "CW"
    Option "ShadowFB" "true"
EndSection
Section "Monitor"
    Identifier "EchoPanel"
EndSection
Section "Screen"
    Identifier "EchoScreen"
    Device "EchoFramebuffer"
    Monitor "EchoPanel"
    DefaultDepth 24
EndSection
Section "InputDevice"
    Identifier "EchoTouch"
    Driver "libinput"
    Option "Device" "/dev/input/event2"
    Option "CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
Section "ServerLayout"
    Identifier "EchoLayout"
    Screen "EchoScreen"
    InputDevice "EchoTouch" "CorePointer"
EndSection
